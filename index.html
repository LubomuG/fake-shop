<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js" integrity="sha512-v2CJ7UaYy4JwqLDIrZUI/4hqeoQieOmAZNXBeQyjo21dadnwR+8ZaIJVT8EE2iyI61OV8e6M8PP2/4hpQINQ/g==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="icon" href="./images/icon.png" type="image/x-icon">
</head>
<body>
    <div class="wrap">
        <header class="main-header">
        <div class="header-container">
            <div class="logo">
                <img src="images/logo.png" alt="LOGO" class="logo-img">
                <span class="logo-text">LOGO</span>
            </div>
            <nav class="top-nav">
                <ul class="nav-links">
                    <li><a href="index.html" class="active">ГОЛОВНА</a></li>
                    <li><a href="#">ПРО НАС</a></li>
                    <li><a href="#">ТОВАРИ</a></li>
                    <li><a href="#">ПОСЛУГИ</a></li>
                    <li><a href="#">БЛОГ</a></li>
                    <li><a href="#">КОНТАКТИ</a></li>
                </ul>
            </nav>
            <div class="header-actions">
                <button class="search-btn">🔍</button>
                <button class="cart-btn">🛒<span class="cart-count">0</span></button>
            </div>
        </div>
    </header>



<main class="pages">

        <!-- Моя частина -->
        <div class="homePage">
            <div class="homePage">
            <div class="background-overlay"></div>
            
            <div class="main-container">
                <header class="page-header">
                    <h1 class="page-title">HOME PAGE</h1>
                </header>
                
                <div class="content-frame">
                    <nav class="frame-nav">
                        <span class="icon">Icon</span>
                        <ul class="frame-nav-links">
                            <li><a href="#">HOME</a></li>
                            <li><a href="#">ABOUT US</a></li>
                            <li><a href="#">CONTACTS</a></li>
                            <li><a href="#">ITEMS</a></li>
                        </ul>
                    </nav>
                    
                    <div class="hero-section">
                        <div class="text-block">
                            <h2>TECHNOLOGY<br>OUR FUTURE</h2>
                            <p>DEVELOPMENT,<br>INNOVATION, SOLUTION.</p>
                        </div>
                        
                        <div class="visual-stack">
                            <img src="./images/suit.png" alt="Чоловічий піджак" class="suit-image">
                            <img src="./images/jewelry.png" alt="Золоте та срібне намисто" class="jewelry-image">
                            <img src="./images/phone.png" alt="Смартфон" class="phone-image">
                            <div class="map-overlay"></div>
                        </div>
                    </div>
        </div>
        <!-- Святослава частина -->
        <div class="aboutUsPage"></div>
        <!-- Стаса частина -->
        <div class="contactPage"></div>
        <!-- Данила частина -->
         <div class="supportPage"></div>
         <!-- Максима частина -->
          <div class="itemsPage"></div>
</main>


    </div>
    <script src="./main.js"></script>
